# Arrastra un .zip de actualización a la raíz del repositorio y esta tarea lo descomprime sola:
# pone cada archivo en su carpeta, borra el .zip y guarda el cambio. Cloudflare publica con eso.
name: Descomprimir actualización

on:
  push:
    paths:
      - "*.zip"

permissions:
  contents: write

concurrency:
  group: descomprimir
  cancel-in-progress: false

jobs:
  descomprimir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir y reemplazar los archivos
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=( *.zip )
          if [ ${#zips[@]} -eq 0 ]; then echo "No hay .zip en la raíz."; exit 0; fi

          for z in "${zips[@]}"; do
            echo "Descomprimiendo $z"
            # Seguridad: nada fuera del repositorio, nada dentro de .git ni de .github.
            if unzip -Z1 "$z" | grep -Eq '(^/|(^|/)\.\.(/|$)|^\.git/|^\.github/)'; then
              echo "::error::$z trae rutas no permitidas. No se aplicó nada."
              exit 1
            fi
            tmp="$(mktemp -d)"
            unzip -q "$z" -d "$tmp"
            # Si el zip trae todo dentro de una carpeta (por ejemplo "crm-talk-x/apps/..."), se usa su contenido.
            root="$tmp"
            mapfile -t top < <(ls -A "$tmp")
            if [ ${#top[@]} -eq 1 ] && [ -d "$tmp/${top[0]}" ] && [[ ! "${top[0]}" =~ ^(apps|packages|scripts)$ ]]; then
              root="$tmp/${top[0]}"
            fi
            cp -a "$root"/. ./
            rm -rf "$tmp"
            git rm -q --cached "$z" 2>/dev/null || true
            rm -f "$z"
            echo "Listo: $z"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898315+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Sin cambios."; exit 0; fi
          git commit -q -m "Actualización descomprimida: ${zips[*]}"
          git push
